[project]
name = "robustdim"
version = "0.1.0"
description = "Robust concept steering for Difference-in-Means (DiM)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Xudong Zhu", email = "xzascc3944@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "torch>=2.6",
    "transformers>=4.51",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
