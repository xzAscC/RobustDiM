model:
  id: Qwen/Qwen3-4B
  layer: 20
  hidden_size: 2560
  dtype: bfloat16
  batch_size: 4

data:
  benign: LLM-LAT/benign-dataset
  harmful: LLM-LAT/harmful-dataset
  dim_n: 100
  cov_n: 3000

methods:
  # slides specify gamma > 0 only
  ridge_gamma: 0.01
  lowvar_frac: 0.01
  # slides leave K unspecified; match LowVar's 1% of d
  moment_k_frac: 0.01

stability:
  replicates: 5
  seed: 0
  pool_n: 4000

steering:
  alpha: 10.0
  greedy: true
  max_new_tokens_harmbench: 256
  max_new_tokens_mmlu: 512

eval:
  harmbench_config: contextual
  harmbench_n: 100
  judge_model: gemini-3.7-flash
  judge_project: nairr-260106-571547
  # gemini-3.x only serves from the multi-region endpoint
  judge_location: global
  mmlu_split: test
  # rows are category-grouped; a seeded random subset is used
  mmlu_n: 50

io:
  logs: logs
  figs: figs
  checkpoints: checkpoints
