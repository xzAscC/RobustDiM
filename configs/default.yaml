model:
  id: Qwen/Qwen3-4B
  layer: 20
  hidden_size: 2560
  dtype: bfloat16
  batch_size: 4

data:
  benign: LLM-LAT/benign-dataset
  harmful: LLM-LAT/harmful-dataset
  dim_n: 100
  cov_n: 3000

methods:
  # slides specify gamma > 0 only
  ridge_gamma: 0.01
  lowvar_frac: 0.01
  # slides leave K unspecified; match LowVar's 1% of d
  moment_k_frac: 0.01

stability:
  replicates: 5
  seed: 0
  pool_n: 16000

subsim:
  tau: 0.95
  ks: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]

sweep:
  layers: [14, 17, 20, 23]
  alphas: [10, 20, 30, 40]
  screen_methods: [dim, moment_proj, moment]
  hb_screen_n: 50
  top_per_method: 2
  mmlu_penalty: 1.0
  fractions: [0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2]
  frac_methods: [moment_proj, lowvar]
  alpha_neighbors: 1
  batch_size: 4

steering:
  alpha: 10.0
  greedy: true
  max_new_tokens_harmbench: 256
  max_new_tokens_mmlu: 2048

eval:
  harmbench_config: contextual
  harmbench_n: 100
  judge_model: gemini-3.7-flash
  judge_project: null
  # gemini-3.x only serves from the multi-region endpoint
  judge_location: global
  mmlu_split: test
  # rows are category-grouped; a seeded random subset is used
  mmlu_n: 50

io:
  logs: logs
  figs: figs
  checkpoints: checkpoints
